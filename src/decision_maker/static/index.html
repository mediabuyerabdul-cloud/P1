<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Decision Maker By A</title>
<style>
  :root { --bg:#0f1420; --card:#171d2b; --ink:#e7ecf3; --muted:#93a0b4; --line:#273142;
          --accent:#5b8cff; --enter:#1fa971; --risky:#d79a1e; --skip:#d4544a; }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) { --bg:#f5f7fa; --card:#fff; --ink:#1a2130; --muted:#5b6678;
      --line:#e3e8ef; --accent:#2a5bd7; --enter:#12805c; --risky:#b4810f; --skip:#c0362c; }
  }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.5 system-ui,Segoe UI,sans-serif; background:var(--bg); color:var(--ink); }
  main { max-width:1080px; margin:0 auto; padding:24px 16px 56px; }
  h1 { font-size:22px; margin:0 0 2px; }
  .sub { color:var(--muted); margin:0 0 16px; }
  .engine { display:inline-block; font-size:12px; padding:3px 10px; border-radius:99px; border:1px solid var(--line); margin-bottom:16px; }
  .engine b { color:var(--accent); }
  .panel { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:16px; }
  label { display:block; font-weight:600; margin-bottom:6px; }
  input, select, textarea { width:100%; background:var(--bg); color:var(--ink); border:1px solid var(--line);
    border-radius:8px; padding:9px; font:inherit; }
  textarea { min-height:90px; resize:vertical; }
  .row { display:flex; gap:12px; flex-wrap:wrap; }
  .row > div { flex:1 1 220px; }
  button { font:inherit; font-weight:600; padding:9px 16px; border-radius:8px; border:1px solid var(--accent);
    background:var(--accent); color:#fff; cursor:pointer; }
  button.ghost { background:transparent; color:var(--accent); }
  button:disabled { opacity:.5; cursor:not-allowed; }
  .hint { color:var(--muted); font-size:12.5px; margin-top:6px; }
  .error { color:var(--skip); margin:8px 0; white-space:pre-wrap; }
  .verdict { font-size:26px; font-weight:800; }
  .ENTER { color:var(--enter); } .RISKY { color:var(--risky); } .SKIP { color:var(--skip); }
  .grid { display:flex; flex-wrap:wrap; gap:10px; margin:12px 0; }
  .stat { background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:8px 12px; min-width:140px; }
  .stat .k { color:var(--muted); font-size:12px; } .stat .v { font-size:16px; font-weight:700; }
  table { width:100%; border-collapse:collapse; margin-top:6px; font-size:13px; }
  th, td { padding:8px 10px; border-bottom:1px solid var(--line); text-align:left; vertical-align:top; }
  th { color:var(--muted); font-weight:600; }
  .pill { display:inline-block; padding:3px 8px; border-radius:6px; font-size:12px; font-weight:700; }
  .pill.High,.pill.ENTER { background:color-mix(in srgb,var(--enter) 18%,transparent); color:var(--enter); }
  .pill.Medium,.pill.RISKY { background:color-mix(in srgb,var(--risky) 18%,transparent); color:var(--risky); }
  .pill.Low,.pill.SKIP { background:color-mix(in srgb,var(--skip) 18%,transparent); color:var(--skip); }
</style>
</head>
<body>
<main>
  <h1>Decision Maker By A</h1>
  <p class="sub">Pick a phase and a feature, upload your data, and get a decision.</p>
  <div class="engine" id="engine">…</div>

  <div class="panel">
    <label>Jev API key — Jev makes the decisions (rule engine runs without it)</label>
    <div class="row">
      <div style="flex:1 1 320px"><input id="jevKey" type="password" placeholder="paste your TYPESAFE_API_KEY…"></div>
      <div style="flex:0 0 auto"><button onclick="saveKey()">Save &amp; connect</button></div>
    </div>
    <div class="hint" id="keyStatus"></div>
  </div>

  <div class="panel">
    <div class="row">
      <div><label>Phase</label><select id="phase" onchange="onPhase()"></select></div>
      <div><label>Feature</label><select id="feature" onchange="onFeature()"></select></div>
    </div>
    <p class="hint" id="about" style="margin-top:10px"></p>

    <div id="featureBody" style="display:none">
      <label style="margin-top:8px">Upload your data (.xlsx or .csv)</label>
      <input type="file" id="file" accept=".xlsx,.csv">
      <div class="hint" id="inputHint"></div>
      <details style="margin-top:8px"><summary class="hint">…or paste CSV instead</summary>
        <textarea id="paste" placeholder="Paste rows (with a header line) here"></textarea>
      </details>
      <div style="margin-top:12px">
        <button id="run" onclick="runFeature()">Make decision</button>
        <button class="ghost" id="dl" onclick="downloadXlsx()" disabled>Download .xlsx</button>
      </div>
    </div>
    <div class="error" id="err"></div>
  </div>

  <div class="panel" id="result" style="display:none"></div>
</main>

<script>
const $ = (id) => document.getElementById(id);
let DATA = null, lastResult = null;

function esc(s){ const d=document.createElement("div"); d.textContent=s==null?"":String(s); return d.innerHTML; }

function showEngine(engine){
  $("engine").innerHTML = engine==="jev"
    ? 'Deciding with: <b>Jev</b> (typesafe.ai) ✓' : 'Deciding with: <b>built-in rules</b> — paste your Jev key for Jev decisions';
  $("keyStatus").innerHTML = engine==="jev"
    ? '<span style="color:var(--enter)">✓ Jev connected.</span>' : 'Not connected. Paste your key (console.typesafe.ai) and Save.';
}

async function saveKey(){
  const key=$("jevKey").value.trim();
  if(!key){ $("keyStatus").textContent="Paste your Jev key first."; return; }
  $("keyStatus").textContent="Connecting…";
  try{
    const res=await fetch("/api/set-key",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({key})});
    const d=await res.json(); if(!res.ok) throw new Error(d.error||("HTTP "+res.status));
    $("jevKey").value=""; showEngine(d.engine);
  }catch(e){ $("keyStatus").textContent=e.message; }
}

async function init(){
  const d=await (await fetch("/api/features")).json();
  DATA=d.phases; showEngine(d.engine);
  $("phase").innerHTML=DATA.map(p=>`<option value="${p.id}">${esc(p.title)}</option>`).join("");
  onPhase();
}

function currentPhase(){ return DATA.find(p=>p.id===$("phase").value); }
function currentFeature(){ const p=currentPhase(); return p&&p.features.find(f=>f.id===$("feature").value); }

function onPhase(){
  const p=currentPhase();
  $("feature").innerHTML = p.features.length
    ? p.features.map(f=>`<option value="${f.id}">${esc(f.title)}</option>`).join("")
    : `<option value="">(no features yet)</option>`;
  onFeature();
}

function onFeature(){
  const f=currentFeature();
  if(!f){ $("about").textContent="Share this phase's spec (like the Phase 1 PDF) and I'll build its features."; $("featureBody").style.display="none"; return; }
  $("about").textContent=f.about;
  $("inputHint").textContent=f.input_hint;
  $("featureBody").style.display="";
  $("result").style.display="none"; $("err").textContent=""; $("dl").disabled=true;
}

async function runFeature(){
  $("err").textContent="";
  const f=currentFeature(); if(!f) return;
  const fd=new FormData();
  fd.append("phase",$("phase").value); fd.append("feature",$("feature").value);
  if($("file").files[0]) fd.append("file",$("file").files[0]);
  fd.append("paste",$("paste").value);
  $("run").disabled=true; $("run").textContent="Deciding…";
  try{
    const res=await fetch("/api/run-feature",{method:"POST",body:fd});
    const d=await res.json(); if(!res.ok) throw new Error(d.error||("HTTP "+res.status));
    lastResult=d; render(d);
  }catch(e){ $("err").textContent=e.message; }
  $("run").disabled=false; $("run").textContent="Make decision";
}

function render(d){
  const conf = d.confidence!=null ? ` <span style="color:var(--muted);font-size:14px">(${Math.round(d.confidence*100)}% conf)</span>` : "";
  let html = `<div class="verdict ${d.verdict}">${esc(d.verdict)}${conf}</div>`;
  html += `<p style="margin:6px 0 2px">${esc(d.headline)}</p>`;
  html += `<div class="grid">` + (d.analysis||[]).map(([k,v])=>`<div class="stat"><div class="k">${esc(k)}</div><div class="v">${esc(v)}</div></div>`).join("") + `</div>`;
  const cols=d.columns||[]; const rows=d.rows||[];
  if(rows.length){
    html += `<table><thead><tr>`+cols.map(c=>`<th>${esc(c.replace(/_/g," "))}</th>`).join("")+`</tr></thead><tbody>`;
    html += rows.map(r=>`<tr>`+cols.map(c=>{
      let v=r[c];
      if(c==="relevance"||c==="stage") return `<td><span class="pill ${c==="relevance"?esc(v):""}">${esc(v)}</span></td>`;
      if(typeof v==="number") v=v.toLocaleString();
      return `<td>${esc(v)}</td>`;
    }).join("")+`</tr>`).join("");
    html += `</tbody></table>`;
  }
  $("result").innerHTML=html; $("result").style.display="";
  $("dl").disabled = !(rows.length);
}

async function downloadXlsx(){
  if(!lastResult) return;
  const res=await fetch("/api/export-xlsx",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({rows:lastResult.rows, recommendation:lastResult})});
  const a=document.createElement("a"); a.href=URL.createObjectURL(await res.blob()); a.download="decisions.xlsx"; a.click();
}

init();
</script>
</body>
</html>
